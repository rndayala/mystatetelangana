<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My State Telangana</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #fff7e6,
        #ffffff,
        #e8f5e9
      );
    }

    h1 {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 32px;
      font-weight: 400;
    }

    .tagline {
      margin-top: 15px;
      font-size: 20px;
      letter-spacing: 3px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>Welcome to Telangana</h1>

    <h2>My State — My Pride</h2>

    <div class="tagline">
      Welcome to Telangana
    </div>

  </main>

</body>
</html>
